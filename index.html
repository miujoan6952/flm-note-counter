<!DOCTYPE html>
<!-- FLM note counter. Made by MiuJoan6952_2 · Idea by VN-X · Vibecoded with Claude (Anthropic).
     One self-contained file: styles, translations, parser, view. Nothing is uploaded anywhere. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đếm nốt FLM</title>
<style>
:root{--bg:#f2f4f0;--ink:#1b2a2f;--mute:#5d6d70;--line:#c9d3cc;--acc:#16645e;--warn:#a8401d;--drop:#e6ece6;--bar:#bcd6cf;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161d1f;--ink:#e4ebe6;--mute:#93a3a3;--line:#2f3d40;--acc:#5fc2b5;--warn:#f08c64;--drop:#1d2729;--bar:#244a47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:36px 20px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px}
.lead{margin:0 0 26px;color:var(--mute);max-width:56ch}
select,button{font:inherit;color:var(--acc);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
#drop{display:block;border:2px dashed var(--line);background:var(--drop);border-radius:8px;padding:38px 20px;text-align:center;cursor:pointer}
#drop.over,#drop:focus-within{border-color:var(--acc)}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
section.res{border-top:1px solid var(--line);margin-top:34px;padding-top:20px}
h2{font-size:1rem;margin:0;word-break:break-all}
.big{font-size:4rem;font-weight:700;line-height:1;color:var(--acc);margin:14px 0 0;font-variant-numeric:tabular-nums}
.unit{margin:2px 0 18px;color:var(--mute)}
h3{font-size:.95rem;margin:22px 0 8px}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 16px;margin:0;max-width:420px}
.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ch{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin:0 0 12px}
.ch .n{font-variant-numeric:tabular-nums;text-align:right}.ch .sub{color:var(--mute);font-size:.85rem}
.ch .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--drop)}
.ch .track span{display:block;height:100%;border-radius:3px;background:var(--bar)}
.note{color:var(--mute);font-size:.9rem;margin:12px 0 0}.warn{color:var(--warn);margin:14px 0 0}
.actions{margin-top:18px}
textarea{display:block;width:100%;margin-top:10px;font:inherit;color:inherit;background:var(--drop);border:1px solid var(--line);border-radius:6px;padding:8px}
details{margin-top:18px;font-size:.88rem;color:var(--mute)}summary{cursor:pointer}
details dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:8px 0}details dd{margin:0}
.tabhead{display:flex;align-items:center;gap:10px}
.tabhead h2{flex:1;min-width:0}
.mini{color:var(--mute);font-size:.9rem;white-space:nowrap}
button.icon{padding:2px 9px;line-height:1.3}
#totalWrap{display:flex;flex-direction:column;align-items:center;margin-top:36px;text-align:center}
#totalWrap[hidden]{display:none}
#totalBtn{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600;padding:10px 22px}
footer{max-width:720px;margin:0 auto;padding:20px;border-top:1px solid var(--line);color:var(--mute);font-size:.88rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="title"></h1><p class="lead" id="lead"></p></div>
    <select id="lang" aria-label="Language">
      <option value="vi">Tiếng Việt</option><option value="en">English</option><option value="id">Bahasa Indonesia</option>
    </select>
  </header>
  <label id="drop"><input id="file" type="file" accept=".flm" multiple><strong id="pick"></strong> <span id="or"></span></label>
  <div id="out"></div>
  <div id="totalWrap" hidden><button id="totalBtn" type="button"></button><div id="totalOut"></div></div>
</main>
<footer id="credits"></footer>

<script>
"use strict";

/* ============================== 1. Translations ============================== */
const TEXT = {

    pick: "Chọn tệp .flm", or: "hoặc kéo thả vào đây", unit: "nốt", byCh: "Theo kênh", pat: "pattern", unnamed: "(chưa đặt tên)",
    patterns: "Pattern", patternsM: "Pattern sau khi gộp chồng", audioTracks: "Audio track", audioClips: "Audio clip", audioClipsM: "Audio clip sau khi gộp chồng",
    hint: "Các pattern giống hệt nhau đặt liền nhau (xếp chồng) được tính là một khi gộp.",
    skip: "Không tính là nốt", drums: "hit trống", auto: "điểm automation", env: "điểm envelope audio", unk: "sự kiện khác",
    none: "Không tìm thấy nốt nào trong tệp này.", warn: "Tệp này có cấu trúc khác với những gì công cụ biết, nên kết quả có thể chưa chính xác.",
    err: "Không đọc được tệp này.", copy: "Sao chép kết quả", copied: "Đã sao chép", copyFail: "Không sao chép tự động được. Hãy chọn và sao chép văn bản bên dưới.",
    collapse: "Thu nhỏ", expand: "Mở rộng", remove: "Đóng tab này", totalBtn: "Tính tổng số nốt của các FLM đang mở", totalTitle: "Tổng số nốt", filesN: n => `từ ${n} tệp`, tech: "Chi tiết kỹ thuật",
    size: "Dung lượng", parsed: "Phần tệp đã đọc", clips: "Số clip", notes: "Lưu ý", made: "Làm bởi", idea: "Ý tưởng từ", vibe: "Vibecode cùng" },
  en: { title: "FLM note counter", lead: "Choose an FL Studio Mobile project (.flm) to see its notes, patterns and audio. Everything is processed on your device and nothing is uploaded.",
    pick: "Choose .flm files", or: "or drop them here", unit: "notes", byCh: "By channel", pat: "patterns", unnamed: "(unnamed)",
    patterns: "Patterns", patternsM: "Patterns with stacks merged", audioTracks: "Audio tracks", audioClips: "Audio clips", audioClipsM: "Audio clips with stacks merged",
    hint: "Identical patterns placed back to back (a stack) count as one when merged.",
    skip: "Not counted as notes", drums: "drum hits", auto: "automation points", env: "audio envelope points", unk: "other events",
    none: "No notes found in this file.", warn: "This file is laid out differently from what this tool knows, so the result may be off.",
    err: "Couldn’t read this file.", copy: "Copy result", copied: "Copied", copyFail: "Couldn’t copy automatically. Select the text below and copy it.",
    collapse: "Collapse", expand: "Expand", remove: "Close this tab", totalBtn: "Count total notes of all open FLMs", totalTitle: "Total notes", filesN: n => `from ${n} ${n === 1 ? "file" : "files"}`, tech: "Technical details",
    size: "File size", parsed: "Part of file read", clips: "Clips", notes: "Notes", made: "Made by", idea: "Idea by", vibe: "Vibecoded with" },
  id: { title: "Penghitung not FLM", lead: "Pilih proyek FL Studio Mobile (.flm) untuk melihat jumlah not, pattern, dan audionya. Semua diproses di perangkatmu dan tidak ada yang diunggah.",
    pick: "Pilih file .flm", or: "atau seret ke sini", unit: "not", byCh: "Per channel", pat: "pattern", unnamed: "(tanpa nama)",
    patterns: "Pattern", patternsM: "Pattern setelah stack digabung", audioTracks: "Audio track", audioClips: "Audio clip", audioClipsM: "Audio clip setelah stack digabung",
    hint: "Pattern identik yang ditempatkan berurutan (stack) dihitung sebagai satu saat digabung.",
    skip: "Tidak dihitung sebagai not", drums: "hit drum", auto: "titik automation", env: "titik envelope audio", unk: "event lain",
    none: "Tidak ada not di file ini.", warn: "Struktur file ini berbeda dari yang dikenali alat ini, jadi hasilnya bisa kurang akurat.",
    err: "File ini tidak bisa dibaca.", copy: "Salin hasil", copied: "Tersalin", copyFail: "Tidak bisa menyalin otomatis. Pilih teks di bawah lalu salin.",
    collapse: "Ciutkan", expand: "Buka", remove: "Tutup tab ini", totalBtn: "Hitung total not dari semua FLM yang terbuka", totalTitle: "Total not", filesN: n => `dari ${n} file`, tech: "Detail teknis",
    size: "Ukuran file", parsed: "Bagian file yang terbaca", clips: "Jumlah clip", notes: "Catatan", made: "Dibuat oleh", idea: "Ide dari", vibe: "Di-vibecode dengan" }
};
const CREDITS = { author: "MiuJoan6952_2", idea: "VN-X", ai: "Claude (Anthropic)" };

const guessLang = () => {
  const l = (navigator.language || "").toLowerCase();
  return l.startsWith("vi") ? "vi" : (l.startsWith("id") || l.startsWith("in")) ? "id" : "en";
};
let lang = guessLang();
const t = key => TEXT[lang][key];

/* ============================== 2. Reading the .flm ==============================
   Unofficial format, worked out from real projects (see flm_notes.py for the full notes):
   "10LF" + chunks; chunk = TAG(4) + LENGTH(u32 LE) + PAYLOAD; CHNL / TRKH / CLIP / EVN2.   */
const PPQ = 128, RECORD_SIZE = 20, LANE_KINDS = ["notes", "automation", "audio", "drums"];
const KIND_FIELD = { notes: "notes", drums: "drums", automation: "auto", audio: "env", unknown: "unk" };

const isTagChar = c => (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || (c >= 48 && c <= 57) || c === 95 || c === 32 || c === 45;
const validTag = (u, p) => p + 4 <= u.length && isTagChar(u[p]) && isTagChar(u[p + 1]) && isTagChar(u[p + 2]) && isTagChar(u[p + 3]);
const tagAt = (u, p) => String.fromCharCode(u[p], u[p + 1], u[p + 2], u[p + 3]);
const child = (chunk, ...tags) => chunk.kids.find(k => tags.includes(k.tag));

/** Parse [start,end) as chunks filling it exactly (children may follow a 0-32 byte prefix), else null. */
function tile(dv, u, start, end, depth = 0) {
  const out = []; let pos = start;
  while (pos < end) {
    if (pos + 8 > end || !validTag(u, pos)) return null;
    const length = dv.getUint32(pos + 4, true);
    if (pos + 8 + length > end) return null;
    const chunk = { tag: tagAt(u, pos), off: pos, length, kids: [] };
    if (length >= 8 && depth < 16)
      for (let prefix = 0; prefix <= 32; prefix += 4) {
        const kids = tile(dv, u, pos + 8 + prefix, pos + 8 + length, depth + 1);
        if (kids) { chunk.kids = kids; break; }
      }
    out.push(chunk); pos += 8 + length;
  }
  return out.length ? out : null;
}

/** Top-level chunks (lenient) and the fraction of the file they cover. */
function parseFile(dv, u) {
  const out = []; let pos = 4;
  while (pos + 8 <= u.length && validTag(u, pos)) {
    const length = dv.getUint32(pos + 4, true);
    if (pos + 8 + length > u.length) break;
    const one = tile(dv, u, pos, pos + 8 + length);
    out.push(one ? one[0] : { tag: tagAt(u, pos), off: pos, length, kids: [] });
    pos += 8 + length;
  }
  return { chunks: out, parsed: (pos - 4) / Math.max(1, u.length - 4) };
}

function channelName(u, chnl) {
  const head = child(chnl, "CHHD");
  if (!head) return null;
  const s = head.off + 8, limit = Math.min(s + 64, u.length); let e = s;
  while (e < limit && u[e] !== 0) e++;
  return new TextDecoder("utf-8").decode(u.subarray(s, e)) || null;
}

function laneKind(u, lane) {
  const desc = child(lane, "DESc");
  return desc && desc.length ? (LANE_KINDS[u[desc.off + 8]] || "unknown") : "unknown";
}

/** 53-bit hash of u[start,end): equal content gives an equal string. */
function hashBytes(u, start, end) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = start; i < end; i++) { h1 = Math.imul(h1 ^ u[i], 2654435761); h2 = Math.imul(h2 ^ u[i], 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36) + ":" + (end - start);
}

/** Every clip in the project: where it is, how long, how many records, and a content signature. */
function readClips(dv, u, chunks, diag) {
  const clips = [];
  for (const chnl of chunks.filter(c => c.tag === "CHNL")) {
    const name = channelName(u, chnl);
    for (const lane of chnl.kids.filter(k => k.tag === "TRKH" || k.tag === "HDTk")) {
      const kind = laneKind(u, lane);
      for (const clip of lane.kids.filter(k => k.tag === "CLIP")) {
        const start = clip.length >= 4 ? dv.getUint32(clip.off + 8, true) : 0;
        const head = child(clip, "CLHd");
        const [visible, loop, offset] = head && head.length >= 24
          ? [0, 8, 16].map(o => dv.getFloat64(head.off + 8 + o, true)) : [0, 0, 0];
        const beats = visible > 0 ? visible : loop;
        const ev = child(clip, "EVN2", "EVNT"), sample = child(clip, "CLSm");
        let records = 0, from = 0, to = 0;
        if (ev) {
          let size = RECORD_SIZE, bodyOff = ev.off + 8, bodyLen = ev.length;
          if (ev.tag === "EVN2") { size = ev.length >= 2 ? dv.getUint16(ev.off + 8, true) : 0; bodyOff += 2; bodyLen = Math.max(0, ev.length - 2); }
          records = size ? Math.floor(bodyLen / size) : 0;
          if (bodyLen && size !== RECORD_SIZE) diag.badSize++;
          if (size && bodyLen % size) diag.ragged++;
          [from, to] = [bodyOff, bodyOff + bodyLen];
        }
        if (kind === "audio" && sample) [from, to] = [sample.off + 8, sample.off + 8 + sample.length];
        clips.push({ channelId: chnl.off, channel: name, laneId: lane.off, kind, start, span: Math.round(beats * PPQ),
          records, sig: [hashBytes(u, from, to), Math.round(beats * PPQ), Math.round(offset * PPQ)].join("|") });
      }
    }
  }
  return clips;
}

/** Runs of identical clips sitting back to back on the same lane ("stacks"). */
function findStacks(clips) {
  const lanes = new Map();
  for (const c of clips) { if (!lanes.has(c.laneId)) lanes.set(c.laneId, []); lanes.get(c.laneId).push(c); }
  const runs = [];
  for (const list of lanes.values()) {
    list.sort((a, b) => a.start - b.start);
    for (const c of list) {
      const run = runs[runs.length - 1], prev = run && run[run.length - 1];
      const stacked = prev && prev.laneId === c.laneId && prev.sig === c.sig && prev.span > 0 && Math.abs(c.start - (prev.start + prev.span)) <= 1;
      if (stacked) run.push(c); else runs.push([c]);
    }
  }
  return runs;
}
function stackSummary(clips) {
  const runs = findStacks(clips);
  return { total: clips.length, merged: runs.length, stacks: runs.filter(r => r.length > 1).length, longest: Math.max(0, ...runs.map(r => r.length)) };
}

/** Everything the page shows for one file. */
function analyse(buf, name) {
  const u = new Uint8Array(buf), dv = new DataView(buf);
  const { chunks, parsed } = parseFile(dv, u);
  const diag = { badSize: 0, ragged: 0 };
  const clips = readClips(dv, u, chunks, diag);
  const r = { name, size: u.length, parsed, clipCount: clips.length, notes: 0, drums: 0, auto: 0, env: 0, unk: 0, issues: [] };
  for (const c of clips) r[KIND_FIELD[c.kind]] += c.records;

  const patterns = clips.filter(c => c.kind === "notes"), audio = clips.filter(c => c.kind === "audio");
  r.patterns = stackSummary(patterns);
  r.audio = { ...stackSummary(audio), tracks: new Set(audio.map(c => c.laneId)).size };
  const byChannel = new Map();
  for (const c of patterns) {
    if (!byChannel.has(c.channelId)) byChannel.set(c.channelId, { name: c.channel, notes: 0, clips: [] });
    const ch = byChannel.get(c.channelId); ch.notes += c.records; ch.clips.push(c);
  }
  r.channels = [...byChannel.values()].map(ch => ({ name: ch.name, notes: ch.notes, ...stackSummary(ch.clips) }));

  if (String.fromCharCode(...u.subarray(0, 4)) !== "10LF") r.issues.push("magic");
  if (parsed < 0.99) r.issues.push("parsed");
  if (diag.badSize) r.issues.push("recordSize");
  if (diag.ragged) r.issues.push("ragged");
  if (r.unk) r.issues.push("unknownLane");
  if (!clips.length) r.issues.push("noClips");
  return r;
}

/* ============================== 3. View ============================== */
const fmt = n => n.toLocaleString(lang === "vi" ? "vi-VN" : lang === "id" ? "id-ID" : "en-US");
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const pairs = (dl, rows) => rows.forEach(([k, v]) => dl.append(el("dt", { textContent: k }), el("dd", { textContent: v })));

/** Copy text to the clipboard. Tries the modern API first, then a hidden-textarea fallback, because the
    modern API is blocked in some contexts (sandboxed previews, some file:// setups). Returns true on success. */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (_) { /* fall through to the fallback */ }
  const box = el("textarea", { value: text, readOnly: true });
  box.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
  document.body.append(box);
  box.focus(); box.select(); box.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) { /* not allowed */ }
  box.remove();
  return ok;
}

/** Text put on the clipboard. Labels are fixed English and numbers use en-US commas, so the
    pasted text looks the same whatever language the page is shown in. */
function summaryText(r) {
  const n = v => v.toLocaleString("en-US");
  return [
    `Notes: ${n(r.notes)}`,
    `Patterns: ${n(r.patterns.total)}`,
    `Patterns (Merged): ${n(r.patterns.merged)}`,
    `Audio Tracks: ${n(r.audio.tracks)}`,
    `Audio Clips: ${n(r.audio.total)}`,
    `Audio Clips (Merged): ${n(r.audio.merged)}`
  ].join("\n");
}

function renderChannels(r) {
  const max = Math.max(...r.channels.map(c => c.notes), 1), box = el("div");
  box.append(el("h3", { textContent: t("byCh") }));
  for (const c of r.channels) {
    const fill = el("span"); fill.style.width = (100 * c.notes / max).toFixed(1) + "%";
    box.append(el("div", { className: "ch" },
      el("span", {}, c.name || t("unnamed"), el("div", { className: "sub", textContent: `${fmt(c.total)} → ${fmt(c.merged)} ${t("pat")}` })),
      el("span", { className: "n", textContent: fmt(c.notes) }),
      el("span", { className: "track" }, fill)));
  }
  return box;
}

/** Everything inside one file's tab, below its header. */
function renderBody(r) {
  const s = el("div");
  s.append(el("div", { className: "big", textContent: fmt(r.notes) }), el("div", { className: "unit", textContent: t("unit") }));
  const stats = el("dl", { className: "stats" });
  pairs(stats, [[t("patterns"), fmt(r.patterns.total)], [t("patternsM"), fmt(r.patterns.merged)],
    [t("audioTracks"), fmt(r.audio.tracks)], [t("audioClips"), fmt(r.audio.total)], [t("audioClipsM"), fmt(r.audio.merged)]]);
  s.append(stats, el("p", { className: "note", textContent: t("hint") }));
  if (r.channels.length) s.append(renderChannels(r)); else if (!r.issues.length) s.append(el("p", { className: "note", textContent: t("none") }));

  const skipped = ["drums", "auto", "env", "unk"].filter(k => r[k]).map(k => `${fmt(r[k])} ${t(k)}`);
  if (skipped.length) s.append(el("p", { className: "note", textContent: `${t("skip")}: ${skipped.join(", ")}` }));
  if (r.issues.length) s.append(el("p", { className: "warn", textContent: t("warn") }));

  const copy = el("button", { type: "button", textContent: t("copy") });
  const manual = el("textarea", { readOnly: true, rows: 6, hidden: true, value: summaryText(r) });
  const failNote = el("p", { className: "warn", hidden: true, textContent: t("copyFail") });
  copy.onclick = async () => {
    if (await copyText(summaryText(r))) {
      copy.textContent = t("copied");
      setTimeout(() => (copy.textContent = t("copy")), 1500);
    } else {          // both methods blocked: show the text so it can be copied by hand
      manual.hidden = failNote.hidden = false;
      manual.focus(); manual.select();
    }
  };
  s.append(el("div", { className: "actions" }, copy), failNote, manual);

  const dl = el("dl");
  pairs(dl, [[t("size"), `${fmt(r.size)} bytes`], [t("parsed"), `${(r.parsed * 100).toFixed(1)}%`], [t("clips"), fmt(r.clipCount)],
    ...(r.issues.length ? [[t("notes"), r.issues.join(", ")]] : [])]);
  s.append(el("details", {}, el("summary", { textContent: t("tech") }), dl));
  return s;
}

/** One tab: header with collapse and remove buttons, then the body (hidden while collapsed). */
function render(r) {
  const body = r.error ? el("p", { className: "warn", textContent: t("err") }) : renderBody(r);
  body.hidden = !!r.collapsed;

  const toggle = el("button", { type: "button", className: "icon", textContent: r.collapsed ? "▸" : "▾" });
  toggle.title = toggle.ariaLabel = t(r.collapsed ? "expand" : "collapse");
  toggle.setAttribute("aria-expanded", String(!r.collapsed));
  toggle.onclick = () => { r.collapsed = !r.collapsed; paint(); };

  const close = el("button", { type: "button", className: "icon", textContent: "✕" });
  close.title = close.ariaLabel = t("remove");
  close.onclick = () => { results = results.filter(x => x !== r); paint(); };

  const summary = r.collapsed && !r.error ? `${fmt(r.notes)} ${t("unit")}` : "";
  const head = el("div", { className: "tabhead" }, toggle, el("h2", { textContent: r.name }), el("span", { className: "mini", textContent: summary }), close);
  return el("section", { className: "res" }, head, body);
}

let results = [];        // one entry per open FLM tab
let totalShown = false;  // true once the total button has been pressed; the total then follows the open tabs

/** The centered total button and, once pressed, the sum of notes over all open (non-failed) tabs. */
function paintTotal() {
  if (!results.length) totalShown = false;
  document.getElementById("totalWrap").hidden = !results.length;
  document.getElementById("totalBtn").textContent = t("totalBtn");
  const box = document.getElementById("totalOut");
  box.replaceChildren();
  if (!totalShown) return;
  const ok = results.filter(r => !r.error);
  box.append(el("div", { className: "big", textContent: fmt(ok.reduce((sum, r) => sum + r.notes, 0)) }),
    el("div", { className: "unit", textContent: `${t("totalTitle")} · ${t("filesN")(ok.length)}` }));
}

function paint() {
  document.documentElement.lang = lang;
  document.title = t("title");
  ["title", "lead", "pick", "or"].forEach(id => (document.getElementById(id).textContent = t(id)));
  document.getElementById("lang").value = lang;
  document.getElementById("credits").textContent =
    `${t("made")} ${CREDITS.author} · ${t("idea")} ${CREDITS.idea} · ${t("vibe")} ${CREDITS.ai}`;
  document.getElementById("out").replaceChildren(...results.map(render));
  paintTotal();
}

async function handleFiles(files) {
  for (const f of files) {
    try { results.push(analyse(await f.arrayBuffer(), f.name)); }
    catch (_) { results.push({ name: f.name, error: true }); }
  }
  paint();
}

/* ============================== 4. Wiring ============================== */
const drop = document.getElementById("drop"), input = document.getElementById("file");
input.addEventListener("change", () => { const files = [...input.files]; input.value = ""; handleFiles(files); });
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => handleFiles(ev.dataTransfer.files));
document.getElementById("lang").addEventListener("change", ev => { lang = ev.target.value; paint(); });
document.getElementById("totalBtn").addEventListener("click", () => { totalShown = true; paintTotal(); });
paint();
</script>
</body>
</html>
